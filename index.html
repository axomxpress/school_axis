<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password - School Axis</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7fe; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { color: #4F46E5; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #4F46E5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #a5a2e0; }
        #message { margin-top: 15px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>New Password</h2>
        <p>Enter a new password for your School Axis account.</p>
        <input type="password" id="new-password" placeholder="New Password (min 6 chars)">
        <button id="reset-btn">Update Password</button>
        <div id="message"></div>
    </div>

    <script>
        // Your Supabase Project Details
        const SUPABASE_URL = 'https://zscymhwpiioxxmlwwbyp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_StGst_IaBa5VPYyHi4c81g_X1TLKvmH';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const btn = document.getElementById('reset-btn');
        const msg = document.getElementById('message');

        btn.addEventListener('click', async () => {
            const password = document.getElementById('new-password').value;
            if (password.length < 6) {
                msg.innerText = "Password must be at least 6 characters.";
                msg.style.color = "red";
                return;
            }

            btn.disabled = true;
            msg.innerText = "Updating...";

            const { error } = await supabase.auth.updateUser({ password: password });

            if (error) {
                msg.innerText = "Error: " + error.message;
                msg.style.color = "red";
                btn.disabled = false;
            } else {
                msg.innerText = "Password updated successfully! You can now log in to the app.";
                msg.style.color = "green";
                btn.innerText = "Done";
            }
        });
    </script>
</body>
</html>
