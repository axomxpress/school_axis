<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - School Axis</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 380px; text-align: center; }
        h2 { color: #1a73e8; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #dadce0; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
        button:disabled { background: #ccc; }
        #status { margin-top: 20px; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Set New Password</h2>
        <input type="password" id="new_pass" placeholder="New Password (min 6 chars)">
        <button id="submit_btn">Update Password</button>
        <div id="status"></div>
    </div>

    <script>
        // 1. PROJECT DETAILS (Updated to be more robust)
        const PROJECT_URL = 'https://zscymhwpiioxxmlwwbyp.supabase.co'.trim();
        const ANON_KEY = 'sb_publishable_StGst_IaBa5VPYyHi4c81g_X1TLKvmH'.trim();

        let supabaseClient;
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('submit_btn');

        try {
            // Initialize
            supabaseClient = supabase.createClient(PROJECT_URL, ANON_KEY);
            statusDiv.innerText = "Connecting to Supabase...";
        } catch (err) {
            statusDiv.innerText = "Setup Error: " + err.message;
            statusDiv.style.color = "red";
        }

        // 2. CHECK SESSION ON LOAD
        window.onload = async () => {
            try {
                const { data, error } = await supabaseClient.auth.getSession();
                if (error || !data.session) {
                    statusDiv.innerText = "No active session. Please request a new link from the app.";
                    statusDiv.style.color = "orange";
                    btn.disabled = true;
                } else {
                    statusDiv.innerText = "Ready to update password.";
                    statusDiv.style.color = "green";
                }
            } catch (e) {
                statusDiv.innerText = "Session check failed.";
            }
        };

        // 3. HANDLE UPDATE
        btn.onclick = async () => {
            const pass = document.getElementById('new_pass').value;

            if (pass.length < 6) {
                alert("Password must be at least 6 characters!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Updating...";
            statusDiv.innerText = "Sending request...";

            try {
                const { error } = await supabaseClient.auth.updateUser({ password: pass });

                if (error) {
                    alert("Update Error: " + error.message);
                    statusDiv.innerText = error.message;
                    statusDiv.style.color = "red";
                    btn.disabled = false;
                    btn.innerText = "Update Password";
                } else {
                    alert("SUCCESS! Your password has been changed.");
                    statusDiv.innerText = "Successfully updated! You can now log in to the app.";
                    statusDiv.style.color = "green";
                    btn.innerText = "Done";
                }
            } catch (err) {
                alert("Unexpected Error: " + err.message);
                btn.disabled = false;
                btn.innerText = "Update Password";
            }
        };
    </script>
</body>
</html>
