<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password - School Axis</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7fe; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #4F46E5; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #4F46E5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:disabled { background: #ccc; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>New Password</h2>
        <p>Enter your new password below.</p>
        <input type="password" id="pass" placeholder="New Password (min 6 chars)">
        <button id="btn">Update Password</button>
        <div id="status"></div>
    </div>

    <script>
        // Use the exact details from your SupabaseApiHelper.java
        const URL = 'https://zscymhwpiioxxmlwwbyp.supabase.co';
        const KEY = 'sb_publishable_StGst_IaBa5VPYyHi4c81g_X1TLKvmH';

        let sbClient;
        try {
            // Initialize the client using the global 'supabase' object from the CDN
            sbClient = supabase.createClient(URL, KEY);
            console.log("Supabase initialized");
        } catch (e) {
            alert("Initialization Error: " + e.message);
        }

        const btn = document.getElementById('btn');
        const passInput = document.getElementById('pass');
        const status = document.getElementById('status');

        btn.addEventListener('click', async () => {
            const newPassword = passInput.value;

            if (newPassword.length < 6) {
                alert("Password too short!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processing...";
            status.innerText = "Updating...";

            try {
                // This sends the new password to Supabase
                const { data, error } = await sbClient.auth.updateUser({ password: newPassword });

                if (error) {
                    alert("Update Failed: " + error.message);
                    status.innerText = "Error: " + error.message;
                    status.style.color = "red";
                    btn.disabled = false;
                    btn.innerText = "Update Password";
                } else {
                    alert("SUCCESS! Password changed. You can now log in to the app.");
                    status.innerText = "Password Updated!";
                    status.style.color = "green";
                    btn.innerText = "Success";
                }
            } catch (err) {
                alert("Critical Error: " + err.message);
                btn.disabled = false;
                btn.innerText = "Update Password";
            }
        });

        // Verify we have a session from the email link
        window.onload = async () => {
            const { data } = await sbClient.auth.getSession();
            if (!data.session) {
                status.innerText = "Warning: No reset session. Did you click the link from your email?";
                status.style.color = "orange";
            } else {
                status.innerText = "Ready to reset password.";
                status.style.color = "blue";
            }
        };
    </script>
</body>
</html>
